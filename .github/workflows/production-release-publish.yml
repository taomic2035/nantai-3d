name: production-release-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  private_stage:
    name: Build and stage private production candidate
    runs-on: [self-hosted, linux, x64, nantai-production-release]
    environment: production-private
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      package_content_id: ${{ steps.verify_bundle.outputs.package_content_id }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact checked-out repository
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .

      - name: Preflight private staging environment
        env:
          ACCEPTANCE_ROOT: ${{ secrets.ACCEPTANCE_ROOT_PATH }}
          PRIVACY_POLICY: ${{ secrets.PRIVACY_POLICY_PATH }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid production release version" >&2
            exit 1
          fi
          if (( ${#VERSION} > 64 )) || ! git check-ref-format "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Production release version is not a valid bounded tag" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the workflow source commit" >&2
            exit 1
          fi
          if [[ "$ACCEPTANCE_ROOT" != /* ]] || [[ ! -d "$ACCEPTANCE_ROOT" ]] || [[ -L "$ACCEPTANCE_ROOT" ]]; then
            echo "Private acceptance directory is unavailable or unsafe" >&2
            exit 1
          fi
          if [[ "$PRIVACY_POLICY" != /* ]] || [[ ! -f "$PRIVACY_POLICY" ]] || [[ -L "$PRIVACY_POLICY" ]]; then
            echo "Private privacy policy is unavailable or unsafe" >&2
            exit 1
          fi
          python -c "import pipeline.production_release_assets, pipeline.production_release_builder"

      - name: Build candidate from private acceptance
        env:
          ACCEPTANCE_ROOT: ${{ secrets.ACCEPTANCE_ROOT_PATH }}
          CANDIDATE: ${{ runner.temp }}/candidate/nantai-production-candidate.zip
        run: |
          set -euo pipefail
          mkdir -p -- "$(dirname "$CANDIDATE")"
          python scripts/build_production_release.py \
            --acceptance-root "$ACCEPTANCE_ROOT" \
            --version "$VERSION" \
            --output "$CANDIDATE"

      - name: Stage acceptance-bound public bundle
        env:
          ACCEPTANCE_ROOT: ${{ secrets.ACCEPTANCE_ROOT_PATH }}
          PRIVACY_POLICY: ${{ secrets.PRIVACY_POLICY_PATH }}
          CANDIDATE: ${{ runner.temp }}/candidate/nantai-production-candidate.zip
          RELEASE_DIR: ${{ runner.temp }}/production-release-assets
          STAGE_JSON: ${{ runner.temp }}/production-stage.json
        run: |
          set -euo pipefail
          python scripts/stage_production_release_assets.py \
            --acceptance-root "$ACCEPTANCE_ROOT" \
            --version "$VERSION" \
            --archive "$CANDIDATE" \
            --privacy-policy "$PRIVACY_POLICY" \
            --output-dir "$RELEASE_DIR" \
            > "$STAGE_JSON"

      - name: Verify and identify the staged bundle
        id: verify_bundle
        env:
          RELEASE_DIR: ${{ runner.temp }}/production-release-assets
          VERIFY_JSON: ${{ runner.temp }}/production-verify.json
          VERIFY_FIELDS: ${{ runner.temp }}/production-verify-fields.txt
        run: |
          set -euo pipefail
          python scripts/verify_production_release_assets.py "$RELEASE_DIR" > "$VERIFY_JSON"
          python - "$VERIFY_JSON" <<'PY' > "$VERIFY_FIELDS"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          print(result["package_content_id"], result["archive_sha256"])
          PY
          read -r content_id archive_sha < "$VERIFY_FIELDS"
          if [[ ! "$content_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Verifier returned an invalid package content ID" >&2
            exit 1
          fi
          if [[ ! "$archive_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Verifier returned an invalid archive SHA-256" >&2
            exit 1
          fi
          archive="$RELEASE_DIR/nantai-3d-${VERSION}-runtime.zip"
          actual_archive_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [[ "$actual_archive_sha" != "$archive_sha" ]]; then
            echo "Staged archive digest changed after verification" >&2
            exit 1
          fi
          printf 'package_content_id=%s\n' "$content_id" >> "$GITHUB_OUTPUT"

      - name: Upload exact public bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nantai-production-release
          retention-days: 2
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/production-release-assets/nantai-3d-${{ env.VERSION }}-runtime.zip
            ${{ runner.temp }}/production-release-assets/nantai-3d-${{ env.VERSION }}-runtime.zip.sha256
            ${{ runner.temp }}/production-release-assets/PRODUCTION-RELEASE.json
            ${{ runner.temp }}/production-release-assets/SHA256SUMS.txt

  public_publish:
    name: Verify and transactionally publish public bundle
    needs: private_stage
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_CONTENT_ID: ${{ needs.private_stage.outputs.package_content_id }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact checked-out repository
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .

      - name: Download fixed private-stage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nantai-production-release
          path: ${{ runner.temp }}/production-release-assets

      - name: Re-verify staged public bytes
        env:
          BUNDLE_DIR: ${{ runner.temp }}/production-release-assets
          VERIFY_JSON: ${{ runner.temp }}/public-verify.json
          VERIFY_FIELDS: ${{ runner.temp }}/public-verify-fields.txt
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid production release version" >&2
            exit 1
          fi
          if (( ${#VERSION} > 64 )) || ! git check-ref-format "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Production release version is not a valid bounded tag" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_CONTENT_ID" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Private staging returned an invalid package content ID" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the workflow source commit" >&2
            exit 1
          fi
          python scripts/verify_production_release_assets.py "$BUNDLE_DIR" > "$VERIFY_JSON"
          python - "$VERIFY_JSON" <<'PY' > "$VERIFY_FIELDS"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          print(result["package_content_id"], result["archive_sha256"])
          PY
          read -r content_id archive_sha < "$VERIFY_FIELDS"
          if [[ ! "$content_id" =~ ^[0-9a-f]{64}$ ]] || [[ "$content_id" != "$EXPECTED_CONTENT_ID" ]]; then
            echo "Public artifact package content ID mismatch" >&2
            exit 1
          fi
          if [[ ! "$archive_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Public artifact archive SHA-256 is invalid" >&2
            exit 1
          fi

      - name: Create draft, verify download, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_DIR: ${{ runner.temp }}/production-release-assets
          DOWNLOADED_DIR: ${{ runner.temp }}/downloaded-release-assets
        run: |
          set -euo pipefail
          python - "$BUNDLE_DIR" "$DOWNLOADED_DIR" <<'PY'
          # BEGIN NUMERIC_RELEASE_TRANSACTION
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.parse
          from pathlib import Path


          class PublicationError(RuntimeError):
              pass


          bundle_dir = Path(sys.argv[1])
          downloaded_dir = Path(sys.argv[2])
          version = os.environ["VERSION"]
          expected_content_id = os.environ["EXPECTED_CONTENT_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          marker = (
              f"Workflow transaction: {run_id}-{run_attempt}@{source_sha}"
          )
          release_endpoint = f"repos/{repository}/releases"
          release_by_tag_endpoint = (
              f"{release_endpoint}/tags/{version}"
          )
          tag_get_endpoint = (
              f"repos/{repository}/git/ref/tags/{version}"
          )
          tag_delete_endpoint = (
              f"repos/{repository}/git/refs/tags/{version}"
          )
          release_id = None
          created_tag = False
          published = False


          def _api_result(*arguments, output=None):
              return subprocess.run(
                  ["gh", "api", *arguments],
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=(
                      subprocess.PIPE if output is None else output
                  ),
                  stderr=subprocess.PIPE,
              )


          def _api_json(*arguments, allow_not_found=False):
              result = _api_result(*arguments)
              if result.returncode != 0:
                  if (
                      allow_not_found
                      and b"HTTP 404" in result.stderr
                  ):
                      return None
                  raise PublicationError("GitHub API request failed")
              try:
                  return json.loads(result.stdout)
              except (TypeError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise PublicationError(
                      "GitHub API returned invalid JSON"
                  ) from exc


          def _assert_tag():
              tag = _api_json(tag_get_endpoint)
              if (
                  not isinstance(tag, dict)
                  or not isinstance(tag.get("object"), dict)
                  or tag["object"].get("sha") != source_sha
              ):
                  raise PublicationError(
                      "Release tag identity changed"
                  )


          def _validate_release(release, *, draft):
              if (
                  not isinstance(release, dict)
                  or not isinstance(release.get("id"), int)
                  or release["id"] != release_id
                  or release.get("tag_name") != version
                  or release.get("target_commitish") != source_sha
                  or release.get("draft") is not draft
                  or marker not in release.get("body", "")
              ):
                  raise PublicationError(
                      "Release transaction identity changed"
                  )
              return release


          def _assert_transaction(*, draft):
              if not isinstance(release_id, int) or release_id <= 0:
                  raise PublicationError(
                      "Release transaction has no numeric identity"
                  )
              release = _api_json(
                  f"{release_endpoint}/{release_id}"
              )
              _validate_release(release, draft=draft)
              _assert_tag()
              return release


          def _cleanup():
              release_deleted = False
              release_missing = False
              if isinstance(release_id, int) and release_id > 0:
                  try:
                      current = _api_json(
                          f"{release_endpoint}/{release_id}",
                          allow_not_found=True,
                      )
                      if current is None:
                          release_missing = True
                      else:
                          _validate_release(current, draft=True)
                          _assert_tag()
                          deleted = _api_result(
                              "--method",
                              "DELETE",
                              f"{release_endpoint}/{release_id}",
                          )
                          release_deleted = deleted.returncode == 0
                  except (PublicationError, OSError):
                      pass
              if not created_tag:
                  return
              if not (
                  release_id is None
                  or release_deleted
                  or release_missing
              ):
                  return
              try:
                  tag = _api_json(
                      tag_get_endpoint,
                      allow_not_found=True,
                  )
                  same_tag = (
                      isinstance(tag, dict)
                      and isinstance(tag.get("object"), dict)
                      and tag["object"].get("sha") == source_sha
                  )
                  tag_release = _api_json(
                      release_by_tag_endpoint,
                      allow_not_found=True,
                  )
                  if same_tag and tag_release is None:
                      _api_result(
                          "--method",
                          "DELETE",
                          tag_delete_endpoint,
                      )
              except (PublicationError, OSError):
                  pass


          def _compare_files(left, right):
              with left.open("rb") as left_stream:
                  with right.open("rb") as right_stream:
                      while True:
                          left_chunk = left_stream.read(1024 * 1024)
                          right_chunk = right_stream.read(1024 * 1024)
                          if left_chunk != right_chunk:
                              raise PublicationError(
                                  "Downloaded release asset changed"
                              )
                          if not left_chunk:
                              return


          def _publish():
              global release_id, created_tag, published
              if (
                  re.fullmatch(
                      r"v[0-9]+\.[0-9]+\.[0-9]+"
                      r"(?:-[0-9A-Za-z.-]+)?",
                      version,
                  )
                  is None
                  or len(version) > 64
                  or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
                  or re.fullmatch(r"[0-9a-f]{64}", expected_content_id)
                  is None
                  or re.fullmatch(
                      r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",
                      repository,
                  )
                  is None
                  or not run_id.isdecimal()
                  or not run_attempt.isdecimal()
              ):
                  raise PublicationError(
                      "Release transaction inputs are invalid"
                  )

              archive_name = (
                  f"nantai-3d-{version}-runtime.zip"
              )
              asset_names = (
                  archive_name,
                  f"{archive_name}.sha256",
                  "PRODUCTION-RELEASE.json",
                  "SHA256SUMS.txt",
              )
              for name in asset_names:
                  source = bundle_dir / name
                  if not source.is_file() or source.is_symlink():
                      raise PublicationError(
                          "Public artifact allowlist is incomplete"
                      )

              if (
                  _api_json(
                      release_by_tag_endpoint,
                      allow_not_found=True,
                  )
                  is not None
                  or _api_json(
                      tag_get_endpoint,
                      allow_not_found=True,
                  )
                  is not None
              ):
                  raise PublicationError(
                      "Release or tag already exists"
                  )

              tag = _api_json(
                  "--method",
                  "POST",
                  f"repos/{repository}/git/refs",
                  "-f",
                  f"ref=refs/tags/{version}",
                  "-f",
                  f"sha={source_sha}",
              )
              created_tag = True
              if (
                  not isinstance(tag, dict)
                  or not isinstance(tag.get("object"), dict)
                  or tag["object"].get("sha") != source_sha
              ):
                  raise PublicationError(
                      "Created tag identity is invalid"
                  )

              _assert_tag()
              if (
                  _api_json(
                      release_by_tag_endpoint,
                      allow_not_found=True,
                  )
                  is not None
              ):
                  raise PublicationError(
                      "Release appeared during creation"
                  )

              body = (
                  "This release was staged by the official Nantai "
                  "production workflow from the protected private "
                  f"staging environment at source commit {source_sha}.\n\n"
                  "The downloaded verifier confirms internal consistency "
                  "of the four-file bundle and package content ID "
                  f"{expected_content_id}. It does not independently prove "
                  "source authenticity, private acceptance, rights, real "
                  "reconstruction, measured alignment, or Viewer QA.\n\n"
                  f"{marker}\n"
              )
              release = _api_json(
                  "--method",
                  "POST",
                  release_endpoint,
                  "-f",
                  f"tag_name={version}",
                  "-f",
                  f"target_commitish={source_sha}",
                  "-f",
                  f"name=Nantai 3D {version}",
                  "-f",
                  f"body={body}",
                  "-F",
                  "draft=true",
                  "-F",
                  "prerelease=false",
                  "-f",
                  "make_latest=false",
              )
              if (
                  not isinstance(release, dict)
                  or not isinstance(release.get("id"), int)
                  or release["id"] <= 0
              ):
                  raise PublicationError(
                      "Created release has no numeric identity"
                  )
              release_id = release["id"]
              _validate_release(release, draft=True)

              uploaded_ids = set()
              for name in asset_names:
                  _assert_transaction(draft=True)
                  encoded_name = urllib.parse.quote(
                      name,
                      safe="",
                  )
                  asset = _api_json(
                      "--method",
                      "POST",
                      "--hostname",
                      "uploads.github.com",
                      "-H",
                      "Content-Type: application/octet-stream",
                      "--input",
                      str(bundle_dir / name),
                      f"repos/{repository}/releases/"
                      f"{release_id}/assets?name={encoded_name}",
                  )
                  if (
                      not isinstance(asset, dict)
                      or not isinstance(asset.get("id"), int)
                      or asset["id"] <= 0
                      or asset.get("name") != name
                      or asset["id"] in uploaded_ids
                  ):
                      raise PublicationError(
                          "Uploaded asset identity is invalid"
                      )
                  uploaded_ids.add(asset["id"])

              _assert_transaction(draft=True)
              assets = _api_json(
                  f"{release_endpoint}/{release_id}/assets"
                  "?per_page=100"
              )
              if not isinstance(assets, list):
                  raise PublicationError(
                      "Release asset inventory is invalid"
                  )
              assets_by_name = {}
              asset_ids = set()
              for asset in assets:
                  if (
                      not isinstance(asset, dict)
                      or not isinstance(asset.get("id"), int)
                      or asset["id"] <= 0
                      or not isinstance(asset.get("name"), str)
                      or asset["name"] in assets_by_name
                      or asset["id"] in asset_ids
                  ):
                      raise PublicationError(
                          "Release asset inventory is invalid"
                      )
                  assets_by_name[asset["name"]] = asset["id"]
                  asset_ids.add(asset["id"])
              if set(assets_by_name) != set(asset_names):
                  raise PublicationError(
                      "Release asset allowlist changed"
                  )

              downloaded_dir.mkdir(parents=True, exist_ok=False)
              for name in asset_names:
                  _assert_transaction(draft=True)
                  asset_id = assets_by_name[name]
                  destination = downloaded_dir / name
                  with destination.open("xb") as stream:
                      result = _api_result(
                          "-H",
                          "Accept: application/octet-stream",
                          f"repos/{repository}/releases/assets/{asset_id}",
                          output=stream,
                      )
                  if result.returncode != 0:
                      raise PublicationError(
                          "Release asset download failed"
                      )
                  _compare_files(bundle_dir / name, destination)

              verification = subprocess.run(
                  [
                      sys.executable,
                      "scripts/verify_production_release_assets.py",
                      str(downloaded_dir),
                  ],
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if verification.returncode != 0:
                  raise PublicationError(
                      "Downloaded release verification failed"
                  )
              try:
                  result = json.loads(verification.stdout)
              except (
                  TypeError,
                  UnicodeDecodeError,
                  json.JSONDecodeError,
              ) as exc:
                  raise PublicationError(
                      "Downloaded verifier returned invalid JSON"
                  ) from exc
              if (
                  result.get("package_content_id")
                  != expected_content_id
                  or re.fullmatch(
                      r"[0-9a-f]{64}",
                      result.get("archive_sha256", ""),
                  )
                  is None
              ):
                  raise PublicationError(
                      "Downloaded release identity is invalid"
                  )

              _assert_transaction(draft=True)
              updated = _api_json(
                  "--method",
                  "PATCH",
                  f"{release_endpoint}/{release_id}",
                  "-F",
                  "draft=false",
                  "-f",
                  "make_latest=true",
              )
              _validate_release(updated, draft=False)
              _assert_transaction(draft=False)
              published = True


          try:
              _publish()
          except (OSError, PublicationError):
              if not published:
                  _cleanup()
              print(
                  "Production release transaction failed",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          # END NUMERIC_RELEASE_TRANSACTION
          PY
