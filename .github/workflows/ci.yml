name: CI

# Cross-platform enforcement matrix. Guards the Windows-green baseline
# (the class of breaks caused by fcntl-only imports, POSIX symlinks and
# CRLF-sensitive parsing) and HANDOFF-002 cross-platform asset
# reproducibility. Provenance-safe: gates fail closed on any mismatch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest commit on one branch is authoritative. Superseded runs
# consume scarce cross-platform runners and delay the exact-head result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# UTF-8 everywhere so CJK/emoji output never trips cp936/cp1252 on Windows.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    # Use bash on every OS (Git Bash ships on GitHub Windows runners) so the
    # step scripts below are identical across the matrix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install (editable + dev extras)
        if: runner.os != 'Windows'
        run: python -m pip install -e ".[dev]"

      - name: Install (editable + dev and Windows Studio extras)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[dev,windows-jobs]"

      - name: Install pinned Node runtime (npm ci)
        # npm ci refuses to drift from package-lock.json; this is the only
        # Node dependency install step in CI, never `npm install` or a
        # floating global package.
        run: npm ci

      - name: Test (pytest + node --test)
        # symlink-dependent tests self-skip when the runner lacks the
        # privilege to create symlinks (default on Windows).
        run: python make.py test

      - name: Lint (ruff)
        run: python make.py lint

  viewer-runtime:
    name: viewer-runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Install locked Chromium runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium

      - name: Install locked Chromium runtime (Windows)
        if: runner.os == 'Windows'
        run: npx --no-install playwright install chromium

      - name: Prove Viewer runtime capabilities
        if: always()
        run: node scripts/viewer_runtime_preflight.mjs --output "$RUNNER_TEMP/viewer-runtime-preflight.json"

      - name: Upload Viewer runtime preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-runtime-preflight-${{ matrix.os }}
          path: ${{ runner.temp }}/viewer-runtime-preflight.json
          if-no-files-found: error

  remote-training-drill:
    name: remote-training-drill (fixed transport fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install editable source and locked dev contract
        run: python -m pip install -e ".[dev]"

      - name: Execute fixed P1-3A/B/C registry from clean exact HEAD
        run: |
          python -I scripts/run_remote_training_drill.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/remote-training-drill.json" \
            --request-sha256 48af7c5d7bea4df0083122ca31cec7db6b0a6677ee58eb960ba93aa76c20a851 \
            --training-config-sha256 ab5c0285c159d271a34c653ab632053783a3908387b10129afd3d09a59b14712 \
            --dataset-receipt-sha256 d4f6678b5dcc05c41dc5cec0681a2c7743d1d019e3c1d39c1583ff2e4ea0d5bc \
            --trainer-name nerfstudio-splatfacto \
            --trainer-version 1.1.5 \
            --container-identity registry.invalid/nantai-ci-fixture@sha256:251c5841df8afb72015c91e8496f6b66764840da802fcf016c449b5518bb46ef

      - name: Upload canonical drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-training-drill
          path: ${{ runner.temp }}/remote-training-drill.json
          if-no-files-found: error

  reproducibility:
    name: repro-assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Regenerate HANDOFF-002 assets (fresh output dir)
        run: |
          python handoff/deliverables/HANDOFF-002/scripts/generate.py \
            --output out_repro

      - name: Hash the 11 regenerated PLYs
        run: |
          python - <<'PY'
          import glob, hashlib, os
          plys = sorted(glob.glob("out_repro/*.ply"))
          assert len(plys) == 11, f"expected 11 PLYs, got {len(plys)}"
          lines = []
          for p in plys:
              with open(p, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              lines.append(f"{digest}  {os.path.basename(p)}")
          text = "\n".join(lines) + "\n"
          with open("plysha.txt", "w", encoding="utf-8", newline="\n") as fh:
              fh.write(text)
          print(text)
          PY

      - name: Validate regenerated assets against committed manifest (fail-closed)
        # Byte-drift from the content-addressed SHA-256 in the committed
        # manifest is a hard failure; never weaken this gate.
        run: |
          cp handoff/deliverables/HANDOFF-002/manifest.json out_repro/manifest.json
          python -m pipeline.validate_handoff out_repro

      - name: Upload per-OS SHA list
        uses: actions/upload-artifact@v4
        with:
          name: plysha-${{ matrix.os }}
          path: plysha.txt

  reproducibility-compare:
    name: repro-compare (ubuntu == windows)
    runs-on: ubuntu-latest
    needs: reproducibility
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all per-OS SHA lists
        uses: actions/download-artifact@v4
        with:
          path: shas

      - name: Assert the 11 PLY SHA-256 are byte-identical across the matrix
        run: |
          ubuntu=shas/plysha-ubuntu-latest/plysha.txt
          windows=shas/plysha-windows-latest/plysha.txt
          echo "== ubuntu =="; cat "$ubuntu"
          echo "== windows =="; cat "$windows"
          if diff -u "$ubuntu" "$windows"; then
            echo "OK: HANDOFF-002 PLY bytes reproduce identically on ubuntu and windows"
          else
            echo "FAIL: cross-platform PLY byte drift detected" >&2
            exit 1
          fi
